batch_id: "batch_001"
batch_goal: "Clarify the system-first architecture."
questions:
  - id: "Q1"
    question: "Should the core system work without any UI attached?"
    scope: "system architecture"
    reason_for_model_later: "This defines whether UI is an adapter or part of the core."
  - id: "Q2"
    question: "Should Python only route existing questions and answers without interpreting them?"
    scope: "Python responsibility"
    reason_for_model_later: "This defines the boundary between deterministic code and model reasoning."
  - id: "Q3"
    question: "Should side questions be visible to the Reasoning Agent but not automatically added to the plan?"
    scope: "side question handling"
    reason_for_model_later: "This defines how user curiosity influences the plan."
